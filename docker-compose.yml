# Local n8n + Mailpit for LendLoop.
# `just n8n-up` starts both and imports the workflows.
# Secrets live only in n8n/.env (gitignored). Ports bind to 127.0.0.1 only.
name: lendloop

services:
  n8n:
    image: n8nio/n8n:2.47.4
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    # N8N_ENCRYPTION_KEY, LENDLOOP_WEBHOOK_SECRET, CONVEX_SITE_URL, ALERT_EMAIL
    env_file: ./n8n/.env
    environment:
      - N8N_HOST=localhost
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=UTC
      - TZ=UTC
      # Plain HTTP on localhost only. Production runs behind TLS
      # with secure cookies on.
      - N8N_SECURE_COOKIE=false
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
      # The Code nodes sign and verify requests with node:crypto and read
      # the shared secret and the Convex URL from $env. Nothing else in
      # this instance needs env access.
      - NODE_FUNCTION_ALLOW_BUILTIN=crypto
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      # Executions hold recipient names and emails: keep them 7 days at most.
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=168
    extra_hosts:
      # Reach the local Convex backend on Linux too.
      - "host.docker.internal:host-gateway"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/lendloop/workflows
      - ./n8n/credentials:/lendloop/credentials:ro
    depends_on:
      - mailpit

  # Catches every email n8n sends. Inbox at http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.33.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"

volumes:
  n8n_data:
